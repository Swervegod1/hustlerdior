<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <link rel="canonical" href="https://hustlerdior.com/" />
    <title>Hustler Dior — We’ll Be Back</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #090909;
        color: #eeeae3;
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 32px 6vw;
      }
      header {
        font-size: 18px;
        font-weight: 900;
        letter-spacing: -0.06em;
        border-bottom: 1px solid #343530;
        padding-bottom: 28px;
      }
      header span {
        color: #e7ff3d;
      }
      main {
        max-width: 900px;
        align-self: center;
        padding: 65px 0;
      }
      small {
        letter-spacing: 0.16em;
        font-size: 11px;
        color: #e7ff3d;
      }
      h1 {
        font-size: clamp(52px, 10vw, 140px);
        letter-spacing: -0.065em;
        line-height: 0.95;
        margin: 25px 0;
      }
      p {
        max-width: 480px;
        line-height: 1.7;
        color: #b9bbb3;
      }
      a {
        display: inline-block;
        color: #eeeae3;
        text-underline-offset: 6px;
        padding: 16px 0;
      }
      footer {
        font-size: 10px;
        letter-spacing: 0.12em;
        border-top: 1px solid #343530;
        padding-top: 24px;
      }
    </style>
  </head>
  <body>
    <header>HUSTLER DIOR <span>✳</span></header>
    <main>
      <small>THE NEXT CHAPTER IS LOADING.</small>
      <h1>BACK IN<br />A MOMENT.</h1>
      <p>
        We’re working on the storefront. Please check back soon to explore the
        collection. Thanks for being part of Hustler Dior.
      </p>
      <a href="https://hustlerdior.com/">Return to Hustler Dior ↗</a>
    </main>
    <footer>INDEPENDENT STREETWEAR. UNFILTERED EXPRESSION.</footer>
  </body>
</html>
