query HustlerDiorCostReadiness($after: String) {
  products(first: 5, after: $after, sortKey: ID) {
    pageInfo { hasNextPage endCursor }
    nodes {
      id title onlineStoreUrl variantsCount { count }
      variants(first: 100) {
        pageInfo { hasNextPage endCursor }
        nodes {
          id price availableForSale inventoryQuantity
          inventoryItem { tracked unitCost { amount currencyCode } }
        }
      }
    }
  }
}
