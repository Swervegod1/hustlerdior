name: One-time dependency security repair
on:
  push:
    branches: ["feature/editorial-storefront-release-20261103"]
permissions:
  contents: write
jobs:
  patch-dependencies:
    if: ${{ github.ref == 'refs/heads/feature/editorial-storefront-release-20261103' && github.event.head_commit.message == 'ci-run-dependency-repair' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/editorial-storefront-release-20261103
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Upgrade patched production dependencies
        run: npm install --save-exact next@16.4.5 sharp@0.35.5 zod@4.6.7
      - name: Repair compatible transitive advisories
        run: |
          npm audit fix || echo "Some development-only advisories may remain; the explicit production audit follows."
      - name: Verify production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:server
      - run: npm run build
        env:
          SITE_URL: https://hustlerdior.com
          CHECKOUT_ENABLED: "false"
      - name: Commit tested package updates to release branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): patch runtime dependencies after verified CI [deps-fixed]"
            git push origin HEAD:feature/editorial-storefront-release-20261103
          fi
